<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么？</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍽️ 本周吃什么？</h1>
        <div id="cloud-status" class="cloud-status disconnected" title="未连接云端">●</div>
    </div>

    <div class="user-config">
        <input type="text" id="user-name" placeholder="输入你的名字..." onchange="saveUserName(this.value)">
    </div>

    <div class="week-grid" id="week-grid"></div>

    <div class="actions">
        <button class="btn-primary" onclick="pickToday()">随机今天</button>
        <button class="btn-secondary" onclick="newWeek()">新的一周</button>
        <button class="btn-history" onclick="toggleHistory()">📅 历史记录</button>
    </div>
</div>

<!-- 历史记录弹窗 -->
<div id="history-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📜 历史与统计</h2>
            <span class="close" onclick="toggleHistory()">&times;</span>
        </div>
        <div class="modal-tabs">
            <button class="tab-btn active" onclick="switchTab('calendar')">📅 日历视图</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 饮食统计</button>
            <button class="tab-btn" onclick="switchTab('menu')">🍴 菜单管理</button>
        </div>
        <div id="calendar-view" class="tab-content active">
            <div id="history-list" class="history-list">
                <p class="loading">加载中...</p>
            </div>
        </div>
        <div id="stats-view" class="tab-content">
            <div id="stats-list" class="stats-list">
                <p class="loading">加载中...</p>
            </div>
        </div>
        <div id="menu-view" class="tab-content">
            <div class="menu-editor">
                <div class="menu-input-group">
                    <input type="text" id="new-food-name" placeholder="添加新选项...">
                    <button class="btn-add" onclick="addMenuItem()">添加</button>
                </div>
                <div id="menu-items-list" class="menu-items-list">
                    <!-- 菜单项将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
