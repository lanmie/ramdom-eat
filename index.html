<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么？</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍽️ 本周吃什么？</h1>
        <div id="cloud-status" class="cloud-status disconnected" title="未连接云端">●</div>
    </div>

    <div class="user-config">
        <input type="text" id="user-name" placeholder="输入你的名字..." onchange="saveUserName(this.value)">
    </div>

    <div class="week-grid" id="week-grid"></div>

    <div class="actions">
        <button class="btn-primary" onclick="pickToday()">随机今天</button>
        <button class="btn-secondary" onclick="newWeek()">新的一周</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
