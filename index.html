<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么？</title>
    <style>
        body { font-family: 'PingFang SC', sans-serif; text-align: center; background: #f5f7fa; padding: 50px 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #2c3e50; }
        #result { font-size: 36px; font-weight: bold; color: #e74c3c; margin: 30px 0; min-height: 54px; }
        button { background: #3498db; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 25px; cursor: pointer; transition: 0.2s; width: 100%; }
        button:hover { background: #2980b9; }
        .history { margin-top: 30px; text-align: left; font-size: 14px; color: #7f8c8d; border-top: 1px dashed #ddd; padding-top: 15px; }
        .history-item { display: inline-block; background: #edf2f7; padding: 4px 10px; border-radius: 12px; margin: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍽️ 今天吃什么？</h1>
    <div id="result">点击下方按钮抽取</div>
    <button onclick="pickFood()">帮我选一个</button>

    <div class="history">
        <strong>最近吃过（最近5次不重复）：</strong>
        <div id="history-list" style="margin-top: 8px;">暂无记录</div>
    </div>
</div>

<script>
    // 你的菜单列表
    const menu = {
        1: "米村",
        2: "炒粉",
        3: "米线",
        4: "山石榴",
        5: "太二",
        6: "刘文祥",
        7: "子固路"
    };

    // 从本地存储获取历史记录（只保留最近5次，刚好完美解决周五到周一、以及工作日5天不重复的问题）
    let historyQueue = JSON.parse(localStorage.getItem('eatHistory')) || [];

    function updateHistoryDisplay() {
        const listDiv = document.getElementById('history-list');
        if (historyQueue.length === 0) {
            listDiv.innerHTML = '暂无记录';
            return;
        }
        listDiv.innerHTML = historyQueue.map(id => `<span class="history-item">${menu[id]}</span>`).join('');
    }

    function pickFood() {
        // 过滤掉历史记录中已经存在的ID
        const availableIds = Object.keys(menu).filter(id => !historyQueue.includes(parseInt(id)));

        if (availableIds.length === 0) {
            alert("所有餐厅都吃过一轮啦！重置历史记录。");
            historyQueue = [];
            localStorage.setItem('eatHistory', JSON.stringify(historyQueue));
            updateHistoryDisplay();
            return;
        }

        // 随机抽取
        const randomIndex = Math.floor(Math.random() * availableIds.length);
        const selectedId = parseInt(availableIds[randomIndex]);
        const foodName = menu[selectedId];

        // 动效
        let count = 0;
        const resultDiv = document.getElementById('result');
        const interval = setInterval(() => {
            const tempIds = Object.keys(menu);
            resultDiv.innerText = menu[tempIds[Math.floor(Math.random() * tempIds.length)]];
            count++;
            if (count > 10) {
                clearInterval(interval);
                // 显示最终结果
                resultDiv.innerText = foodName;

                // 更新历史队列：加入新记录，保持长度不超过 5
                historyQueue.push(selectedId);
                if (historyQueue.length > 5) {
                    historyQueue.shift(); // 移出最早的一次
                }

                // 持久化保存
                localStorage.setItem('eatHistory', JSON.stringify(historyQueue));
                updateHistoryDisplay();
            }
        }, 50);
    }

    // 初始化显示
    updateHistoryDisplay();
</script>

</body>
</html>
